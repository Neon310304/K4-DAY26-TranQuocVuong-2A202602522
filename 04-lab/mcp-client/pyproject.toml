[project]
name = "mcp-client"
version = "0.1.0"
description = "Weather Agent using Google ADK with remote MCP server on Cloud Run"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[mcp]==2.12.0",
    "litellm>=1.84,<2",
    "mcp[cli]==2.3.0",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "packaging>=23", "uvicorn>=0.34"]
