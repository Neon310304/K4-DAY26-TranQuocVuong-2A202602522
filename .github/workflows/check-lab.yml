name: Day26 local checks
on:
  push:
  pull_request:
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --locked --project 04-lab/mcp-client --python 3.12
      - run: uv sync --locked --project 04-lab/mcp-server --python 3.12
      - run: uv pip check --python 04-lab/mcp-client/.venv/bin/python
      - run: uv pip check --python 04-lab/mcp-server/.venv/bin/python
      - run: uv run --project 04-lab/mcp-client python scripts/check_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day26-local-evidence
          path: reports/evidence/
